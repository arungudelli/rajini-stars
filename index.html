<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>A tribute to Thalaivar | Arun Gudelli</title>

  <script src="app.js?v=3" defer></script>

    </div>

      <a class="social-link" href="https://www.instagram.com/codewitharungudelli/" target="_blank" rel="noopener noreferrer" aria-label="Arun Gudelli on Instagram" title="Instagram: @codewitharungudelli">
